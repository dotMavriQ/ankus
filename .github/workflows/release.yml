name: release

# Pushing a tag like v0.1.0 builds ankus.phar, records where and how it was
# built (GitHub build provenance), and publishes it as a release.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          ini-values: phar.readonly=0
          coverage: none
      - name: Version in the code matches the tag
        run: |
          grep -q "VERSION = '${GITHUB_REF_NAME#v}'" src/Cli.php || { echo "src/Cli.php VERSION does not match $GITHUB_REF_NAME"; exit 1; }
      - run: composer install --no-dev --no-interaction --no-progress --no-plugins --no-scripts
      - run: php build/build-phar.php ankus.phar
      - run: ./ankus.phar --version
      - run: sha256sum ankus.phar > ankus.phar.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ankus.phar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" ankus.phar ankus.phar.sha256 --title "$GITHUB_REF_NAME" --notes-file notes.md

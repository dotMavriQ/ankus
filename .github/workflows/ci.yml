name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, zlib
          coverage: none
      - run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - run: vendor/bin/phpstan analyse --no-progress

  phar:
    # The PHAR must behave exactly like bin/ankus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          ini-values: phar.readonly=0
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress --no-plugins --no-scripts
      - run: php build/build-phar.php ankus.phar
      - run: ./ankus.phar --version
      - name: PHAR and bin/ankus report the same thing
        run: |
          set +e
          ./ankus.phar diff tests/packages/plugin-v1 tests/packages/plugin-v2 --json > phar.json; test $? -eq 1
          php bin/ankus diff tests/packages/plugin-v1 tests/packages/plugin-v2 --json > bin.json; test $? -eq 1
          cmp phar.json bin.json

  corpus:
    # Release gate: every recoverable real attack must still be caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, zlib
          coverage: none
      - run: composer install --no-interaction --no-progress --no-plugins --no-scripts
      - run: php corpus/run.php
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme-ci-example:
    # The "Using ankus in CI" example from the README, as written, on a small project.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: A small project
        working-directory: .
        run: |
          mkdir demo
          echo '{"require": {"guzzlehttp/guzzle": "^7.9"}}' > demo/composer.json
          composer update --no-plugins --no-scripts --no-interaction --no-progress --working-dir=demo

      # From here on, the steps are the README's.
      - name: Install ankus
        run: |
          curl -sSL -o "$RUNNER_TEMP/ankus.phar" https://github.com/dotMavriQ/ankus/releases/download/v0.1.0/ankus.phar
          gh attestation verify "$RUNNER_TEMP/ankus.phar" --repo dotMavriQ/ankus
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download dependencies without running any of their code
        run: composer install --no-plugins --no-scripts --no-interaction --no-progress
      - name: Approve the current state (in a real project, ankus.lock is committed)
        run: php "$RUNNER_TEMP/ankus.phar" lock
      - name: Check dependency capabilities
        run: php "$RUNNER_TEMP/ankus.phar" check
      - name: Finish installing (plugins and scripts run now)
        run: composer install --no-interaction --no-progress
